# config/models.yaml  - prices per 1M tokens; confirm on the OpenAI pricing page
default_model: gpt-6-luna
models:
  gpt-6-luna:                 # current small model (reasoning)
    input_per_1m: 0.10
    cached_input_per_1m: 0.01
    output_per_1m: 0.50
    reasoning: true
    reasoning_effort: low
  gpt-5.6-luna:               # fallback if a feature is missing on gpt-6-luna
    input_per_1m: 0.20
    cached_input_per_1m: 0.02
    output_per_1m: 1.20
    reasoning: true
    reasoning_effort: low
  text-embedding-3-small:
    input_per_1m: 0.02
    output_per_1m: 0.0
    reasoning: false